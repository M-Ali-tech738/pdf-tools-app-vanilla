<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF to JPG - PDF Tools</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="container mt-4">
    <h1 class="display-5 mb-4">PDF to JPG Converter</h1>
    <div class="card p-4">
      <input type="file" id="pdfInput" accept="application/pdf" class="form-control mb-3">
      <button onclick="convertPdfToJpg()" class="btn btn-primary">Convert</button>
      <div id="loading" class="mt-3 d-none">Processing...</div>
      <div id="output" class="mt-3"></div>
    </div>
    <a href="/" class="btn btn-secondary mt-3">Back to Home</a>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="/js/pdf-to-jpg.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
